server {
    listen 80;
    server_name localhost;

    # 대용량 업로드 허용 (백엔드로 프록시되는 요청 포함)
    client_max_body_size 10G;
    client_body_timeout 600s;

    # React 정적 파일 서빙
    root /usr/share/nginx/html;
    index index.html;

    # ============================================
    # API 요청 → 백엔드(FastAPI) 프록시
    # ============================================
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 대용량 업로드 타임아웃
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    # API 문서 (Swagger)
    location /docs {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 헬스 체크
    location /health {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 영상 파일 서빙 (백엔드의 /videos 경로)
    location /videos/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }

    # ============================================
    # LiveKit WebSocket 시그널링 프록시
    # 클라이언트가 wss://ngrok-url/rtc?... 로 연결하면 여기서 LiveKit으로 전달
    # ============================================
    location /rtc {
        proxy_pass http://livekit:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # WebSocket keepalive: 20초마다 핑 전송으로 ngrok 연결 유지
        proxy_socket_keepalive on;
    }

    # ============================================
    # React SPA 라우팅 (새로고침 시 index.html 반환)
    # ============================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 에러 페이지
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
