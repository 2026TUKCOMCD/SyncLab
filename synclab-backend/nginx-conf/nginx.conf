worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 로그
    access_log  logs/access.log;
    error_log   logs/error.log info;

    server {
        listen       80;
        server_name  localhost;

        # 대용량 업로드 설정
        client_max_body_size 10G;
        client_body_timeout 600s;
        client_body_buffer_size 128k;

        # ============================================
        # 모바일 API (main.py 포트 3000)
        # ============================================
        
        # 모바일 세션 API
        location /api/mobile/create_session {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        
        location /api/mobile/join_session {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 모바일 영상 업로드 API (타임아웃 길게)
        location /api/mobile/upload/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # 대용량 파일 업로드 타임아웃
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_request_buffering off;
        }

        # 모바일 프록시 체크
        location /api/mobile/proxy/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # 프록시 생성 대기 시간
            proxy_connect_timeout 600s;
            proxy_read_timeout 600s;
        }

        # 모바일 영상 목록
        location /api/mobile/list/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ============================================
        # 웹 API (main.py 포트 3000)
        # ============================================
        
        # 웹 인증 (로그인/회원가입)
        location /web/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ============================================
        # 기타 API (main.py 포트 3000)
        # ============================================
        
        # 헬스 체크
        location /health {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # API 문서 (Swagger UI)
        location /docs {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # 나머지 모든 API
        location /api/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ============================================
        # 정적 파일 (S3로 이동했으므로 제거 가능)
        # ============================================
        
        # 로컬 테스트용 정적 파일 (필요시 주석 해제)
        # location /static/original/ {
        #     alias C:/Users/paul2/Desktop/synclab-backend/uploads/original/;
        #     autoindex on;
        #     add_header Access-Control-Allow-Origin *;
        # }
        
        # location /static/proxy/ {
        #     alias C:/Users/paul2/Desktop/synclab-backend/uploads/proxy/;
        #     autoindex on;
        #     add_header Access-Control-Allow-Origin *;
        # }

        # ============================================
        # 프론트엔드 (나중에 React/Vue 등)
        # ============================================
        location / {
            # 프론트엔드 개발 서버 (예: React 3001번 포트)
            # proxy_pass http://127.0.0.1:3001;
            
            # 또는 빌드된 정적 파일 서빙
            # root C:/Users/paul2/Desktop/synclab-frontend/dist;
            # index index.html;
            # try_files $uri $uri/ /index.html;
            
            # 임시: API 문서로 리다이렉트
            return 301 /docs;
        }

        # 에러 페이지
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}