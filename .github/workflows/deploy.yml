name: Deploy to EC2

on:
  push:
    branches:
      - main  # main 브랜치에 push할 때만 실행

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. EC2에 SSH 접속하여 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Synclab

            # PAT를 사용하여 최신 코드 pull
            git remote set-url origin https://${{ secrets.GH_PAT }}@github.com/2026TUKCOMCD/Synclab.git
            git fetch origin
            git checkout main
            git reset --hard origin/main

            # .env 파일 최신화
            echo "${{ secrets.ENV_FILE }}" > .env

            # 이미지 재빌드 및 서비스 재시작
            docker compose down
            docker compose build --no-cache
            docker compose up -d

            # 실행 상태 확인
            docker compose ps
